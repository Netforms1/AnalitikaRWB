services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analitika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analitika}
      POSTGRES_DB: ${POSTGRES_DB:-analitika}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-analitika}:${POSTGRES_PASSWORD:-analitika}@db:5432/${POSTGRES_DB:-analitika}
    ports:
      - "8000:8000"
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "5173:5173"

volumes:
  pgdata:
